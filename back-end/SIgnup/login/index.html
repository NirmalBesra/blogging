<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer ></script>
</head>

<body>
    <div class="panel">
        <div class="changeto">
            <button type="button" class="tab-btn active" data-target="login">Log in</button>
            <button type="button" class="tab-btn" data-target="register">Register</button>
        </div>
    </div>
    <div class="main">
        <!-- login section -->
        <form action="">
            <p>Welcome bck</p>
            <h1>Log into ur accnt</h1>

            <div class="login fld">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="****@gmail.com" required>
            </div>

            <div class="login fld">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn">Log in</button>

        </form>
        <!-- signup section -->
        <form action="">
            <h1>Create ur accnt</h1>

            <div class="signfld">
                <label for="register-name">Full name</label>
                <input type="text" id="register-name" placeholder="Your name" required>

            </div>
            <div class="signfld">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" placeholder="you@example.com" required>

            </div>
            <div class="signfld">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" placeholder="At least 8 characters" required>
                
            </div>

            <div class="signfld">
                <label for="register-confirm">Confirm password</label>
                <input type="password" id="register-confirm" placeholder="Repeat your password" required>
                
            </div>

            <button type="submit" class="submit-btn">Create account</button>


        </form>
    </div>
</body>

</html>
